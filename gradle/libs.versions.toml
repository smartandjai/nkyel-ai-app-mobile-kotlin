[versions]
agp                     = "9.2.0"
kotlin                  = "2.3.21"
coreKtx                 = "1.15.0"
activityCompose         = "1.9.3"
lifecycleRuntimeKtx     = "2.9.0"
composeBom              = "2025.02.00"
navigationCompose       = "2.8.9"
datastorePreferences    = "1.1.2"
coroutines              = "1.9.0"
hilt                    = "2.60"
hiltNavigationCompose   = "1.2.0"
ktor = "3.0.0"
okhttp3                 = "5.0.0-alpha.14"
okhttp3Sse              = "5.0.0-alpha.14"
kotlinSerialization     = "1.11.0"
junit                   = "4.13.2"
junitExt                = "1.2.1"
espressoCore            = "3.6.1"
markdownRenderer        = "0.27.0"
haze                    = "2.0.0-alpha03"
material3Adaptive       = "1.1.0"
profileInstaller        = "1.4.1"
room                    = "2.8.4"
apachePoi               = "5.2.5"
coil3                   = "3.1.0"
jsoup                   = "1.18.3"
composeIcons            = "2.2.1"
[libraries]
# Core
androidx-core-ktx                   = { group = "androidx.core",            name = "core-ktx",                          version.ref = "coreKtx" }
androidx-activity-compose           = { group = "androidx.activity",         name = "activity-compose",                  version.ref = "activityCompose" }

# Lifecycle
androidx-lifecycle-runtime-ktx      = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",             version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose  = { group = "androidx.lifecycle",        name = "lifecycle-runtime-compose",         version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose= { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose",       version.ref = "lifecycleRuntimeKtx" }

# Compose BOM
androidx-compose-bom                = { group = "androidx.compose",          name = "compose-bom",                       version.ref = "composeBom" }
androidx-ui                         = { group = "androidx.compose.ui",       name = "ui" }
androidx-ui-graphics                = { group = "androidx.compose.ui",       name = "ui-graphics" }
androidx-ui-tooling-preview         = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
androidx-ui-tooling                 = { group = "androidx.compose.ui",       name = "ui-tooling" }
androidx-ui-test-manifest           = { group = "androidx.compose.ui",       name = "ui-test-manifest" }
androidx-ui-test-junit4             = { group = "androidx.compose.ui",       name = "ui-test-junit4" }
androidx-material3                  = { group = "androidx.compose.material3",name = "material3" }
androidx-material-icons-extended    = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-material3-adaptive         = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "material3Adaptive" }
androidx-material3-adaptive-nav     = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "material3Adaptive" }
mikepenz-markdown-m3                = { group = "com.mikepenz",              name = "multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }
mikepenz-markdown-code              = { group = "com.mikepenz",              name = "multiplatform-markdown-renderer-code", version.ref = "markdownRenderer" }
haze-jetpack-compose                = { group = "dev.chrisbanes.haze",      name = "haze",             version.ref = "haze" }
coil-compose                        = { group = "io.coil-kt.coil3",          name = "coil-compose",                      version.ref = "coil3" }
profileinstaller                    = { group = "androidx.profileinstaller", name = "profileinstaller",              version.ref = "profileInstaller" }
compose-icons-lucide                = { group = "com.composables", name = "icons-lucide-android",          version.ref = "composeIcons" }

# Navigation
androidx-navigation-compose         = { group = "androidx.navigation",       name = "navigation-compose",                version.ref = "navigationCompose" }

# DataStore
androidx-datastore-preferences      = { group = "androidx.datastore",        name = "datastore-preferences",             version.ref = "datastorePreferences" }

# Room
androidx-room-runtime               = { group = "androidx.room",             name = "room-runtime",                      version.ref = "room" }
androidx-room-compiler              = { group = "androidx.room",             name = "room-compiler",                     version.ref = "room" }
androidx-room-ktx                   = { group = "androidx.room",             name = "room-ktx",                          version.ref = "room" }

# Coroutines
kotlinx-coroutines-android          = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android",        version.ref = "coroutines" }

# Hilt
hilt-android                        = { group = "com.google.dagger",         name = "hilt-android",                      version.ref = "hilt" }
hilt-android-compiler               = { group = "com.google.dagger",         name = "hilt-android-compiler",             version.ref = "hilt" }
androidx-hilt-navigation-compose    = { group = "androidx.hilt",             name = "hilt-navigation-compose",           version.ref = "hiltNavigationCompose" }

# Ktor
ktor-client-android                 = { group = "io.ktor",                   name = "ktor-client-android",               version.ref = "ktor" }
ktor-client-core                    = { group = "io.ktor",                   name = "ktor-client-core",                  version.ref = "ktor" }
ktor-client-serialization           = { group = "io.ktor",                   name = "ktor-client-serialization",         version.ref = "ktor" }
ktor-client-content-negotiation     = { group = "io.ktor",                   name = "ktor-client-content-negotiation",   version.ref = "ktor" }
ktor-serialization-kotlinx-json     = { group = "io.ktor",                   name = "ktor-serialization-kotlinx-json",   version.ref = "ktor" }

# OkHttp3
okhttp3                             = { group = "com.squareup.okhttp3",      name = "okhttp",                            version.ref = "okhttp3" }
okhttp3-sse                         = { group = "com.squareup.okhttp3",      name = "okhttp-sse",                version.ref = "okhttp3Sse" }

# Serialization
kotlin-serialization                = { group = "org.jetbrains.kotlinx",     name = "kotlinx-serialization-json",        version.ref = "kotlinSerialization" }

# Apache POI
apache-poi                          = { group = "org.apache.poi",            name = "poi-ooxml",                         version.ref = "apachePoi" }

# Jsoup
jsoup                               = { group = "org.jsoup",                 name = "jsoup",                             version.ref = "jsoup" }

# Test
junit                               = { group = "junit",                     name = "junit",                             version.ref = "junit" }
androidx-junit                      = { group = "androidx.test.ext",         name = "junit",                             version.ref = "junitExt" }
androidx-espresso-core              = { group = "androidx.test.espresso",    name = "espresso-core",                     version.ref = "espressoCore" }

ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
[plugins]
android-application = { id = "com.android.application",            version.ref = "agp" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",version.ref = "kotlin" }
kotlin-serialization= { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android",     version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp",            version = "2.3.7" }
