name: Ñkyel Android APK Build
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Ñkyel Android Beta APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version=9.4.1
          fi
          chmod +x ./gradlew

      - name: Run Available Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace || echo "No unit tests found or executed"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Generated APK Exists and Is Nonempty
        run: |
          APK_FILE=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          if [ ! -s "$APK_FILE" ]; then
            echo "ERROR: Generated APK is missing or empty!"
            exit 1
          fi
          echo "Verified APK: $APK_FILE ($(du -h "$APK_FILE" | cut -f1))"

      - name: Compute SHA256 Checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum *.apk > Nkyel-Android-Beta.sha256
          cat Nkyel-Android-Beta.sha256

      - name: Upload Nkyel-Android-Beta APK & Checksum
        uses: actions/upload-artifact@v4
        with:
          name: Nkyel-Android-Beta
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/Nkyel-Android-Beta.sha256
          if-no-files-found: error
          retention-days: 30
