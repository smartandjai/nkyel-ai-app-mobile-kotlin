# === MÉMOIRE — CRITIQUE POUR 4GB RAM ===
# Gradle daemon max 1GB (au lieu de 2GB par défaut)
org.gradle.jvmargs=-Xmx2048m -Xms256m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC

# Désactiver le daemon (évite l'accumulation mémoire entre builds)
org.gradle.daemon=false

# Un seul worker (moins de RAM parallèle)
org.gradle.parallel=false
org.gradle.workers.max=1

# Cache des résultats (ne recompile pas ce qui n'a pas changé)
org.gradle.caching=true
org.gradle.configureondemand=true

# === KOTLIN — COMPILATION INCRÉMENTALE ===
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvm.options=-Xmx512m

# === ANDROID — OPTIMISATIONS ===
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.enableR8.fullMode=true


# === COMPOSE — METRICS OFF EN DEBUG ===
android.compose.compiler.metrics.enabled=false
android.compose.compiler.reports.enabled=false
